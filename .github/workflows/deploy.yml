name: Deploy

# Every push to master builds the three app images and pushes them to GHCR.
# The server (CT 103) polls the :master tags (bloop-update.timer) and deploys
# new images itself, so nothing in CI can reach the server.
on:
  push:
    branches: [master, ci/deploy] # TEMP: ci/deploy for testing, remove before merge
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-master
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/rage-corps

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [frontend, backend, temporal-worker]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/bloop-${{ matrix.service }}
          tags: type=sha,format=short,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.service }}.prod.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Move :master only once all three images exist, so the server never
  # deploys a mix of old and new images.
  promote:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag :master
        run: |
          tag="sha-${GITHUB_SHA::7}"
          for svc in frontend backend temporal-worker; do
            docker buildx imagetools create \
              -t "$REGISTRY/bloop-$svc:master" "$REGISTRY/bloop-$svc:$tag"
          done
